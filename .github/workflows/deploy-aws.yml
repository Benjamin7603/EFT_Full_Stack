name: Build and Push GeoFire

on:
  push:
    branches:
      - feature/devops-aws-deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Repositorio
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-web
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/geofire-frontend:latest

      - name: Build y push gateway
        uses: docker/build-push-action@v6
        with:
          context: ./backend/ms-gateway
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/geofire-gateway:latest

      - name: Build y push bff
        uses: docker/build-push-action@v6
        with:
          context: ./backend/ms-bff
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/geofire-bff:latest

      - name: Build y push eureka
        uses: docker/build-push-action@v6
        with:
          context: ./backend/ms-eureka-server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/geofire-eureka:latest

      - name: Build y push usuarios
        uses: docker/build-push-action@v6
        with:
          context: ./backend/ms-usuarios
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/geofire-usuarios:latest

      - name: Build y push reportes
        uses: docker/build-push-action@v6
        with:
          context: ./backend/ms-reportes
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/geofire-reportes:latest

      - name: Build y push geografico
        uses: docker/build-push-action@v6
        with:
          context: ./backend/ms-geografico
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/geofire-geografico:latest

      - name: Build y push notificaciones
        uses: docker/build-push-action@v6
        with:
          context: ./backend/ms-notificaciones
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/geofire-notificaciones:latest