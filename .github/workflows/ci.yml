name: GeoFire CI

on:
  push:
    branches:
      - feature/**
      - docs/**
      - main

jobs:
  backend-tests:
    name: Backend Maven Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - backend/ms-eureka-server
          - backend/ms-gateway
          - backend/ms-usuarios
          - backend/ms-reportes
          - backend/ms-geografico
          - backend/ms-notificaciones
          - backend/ms-bff

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Run Maven Tests
        working-directory: ${{ matrix.service }}
        run: mvn clean test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        working-directory: ./frontend-web
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend-web
        run: npm run build
