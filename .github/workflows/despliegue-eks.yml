name: Deploy GeoFire to Amazon EKS

on:
  push:
    branches:
      - feature/devops-aws-deploy
      # - main

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Autenticarse en AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # 2. Login en Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Construir imágenes Docker y subirlas a ECR
      - name: Build, tag and push GeoFire images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/geofire-postgres-db:$IMAGE_TAG ./database
          docker push $ECR_REGISTRY/geofire-postgres-db:$IMAGE_TAG
          
          docker build -t $ECR_REGISTRY/geofire-eureka-server:$IMAGE_TAG ./backend/ms-eureka-server
          docker push $ECR_REGISTRY/geofire-eureka-server:$IMAGE_TAG
          
          docker build -t $ECR_REGISTRY/geofire-gateway:$IMAGE_TAG ./backend/ms-gateway
          docker push $ECR_REGISTRY/geofire-gateway:$IMAGE_TAG
          
          docker build -t $ECR_REGISTRY/geofire-usuarios:$IMAGE_TAG ./backend/ms-usuarios
          docker push $ECR_REGISTRY/geofire-usuarios:$IMAGE_TAG
          
          docker build -t $ECR_REGISTRY/geofire-reportes:$IMAGE_TAG ./backend/ms-reportes
          docker push $ECR_REGISTRY/geofire-reportes:$IMAGE_TAG
          
          docker build -t $ECR_REGISTRY/geofire-geografico:$IMAGE_TAG ./backend/ms-geografico
          docker push $ECR_REGISTRY/geofire-geografico:$IMAGE_TAG
          
          docker build -t $ECR_REGISTRY/geofire-notificaciones:$IMAGE_TAG ./backend/ms-notificaciones
          docker push $ECR_REGISTRY/geofire-notificaciones:$IMAGE_TAG
          
          docker build -t $ECR_REGISTRY/geofire-bff:$IMAGE_TAG ./backend/ms-bff
          docker push $ECR_REGISTRY/geofire-bff:$IMAGE_TAG
          
          docker build \
            --build-arg VITE_API_URL=. \
            -t $ECR_REGISTRY/geofire-frontend-web:$IMAGE_TAG ./frontend-web
          docker push $ECR_REGISTRY/geofire-frontend-web:$IMAGE_TAG

      # 4. Configurar kubectl para conectarse al cluster EKS
      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      # 5. Reemplazar variables del manifiesto y desplegar
      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cp k8s/back.yml k8s/back-rendered.yml
          
          sed -i "s|\${ECR_REGISTRY}|$ECR_REGISTRY|g" k8s/back-rendered.yml
          sed -i "s|\${IMAGE_TAG}|$IMAGE_TAG|g" k8s/back-rendered.yml
          
          kubectl apply -f k8s/back-rendered.yml

      # 6. Mostrar estado final
      - name: Show Kubernetes resources
        run: |
          kubectl get pods -n geofire
          kubectl get services -n geofire
