spring.application.name=ms-reportes
server.port=${PORT:8081}

# CONEXIÓN A POSTGRES LOCAL (DOCKER)
spring.datasource.url=jdbc:postgresql://postgres-db:5432/eft_incendios?currentSchema=reportes_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}

springdoc.api-docs.path=/api/reportes/v3/api-docs
springdoc.swagger-ui.path=/api/reportes/swagger-ui.html

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always