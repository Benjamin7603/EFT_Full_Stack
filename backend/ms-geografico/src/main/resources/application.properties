spring.application.name=ms-geografico
server.port=${PORT:8083}

# CONEXIÓN A POSTGRES LOCAL (DOCKER)
spring.datasource.url=jdbc:postgresql://postgres-db:5432/eft_incendios?currentSchema=geografico_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# CONFIGURACION DE JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# EUREKA
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}

# Swagger
springdoc.api-docs.path=/api/geografico/v3/api-docs
springdoc.swagger-ui.path=/api/geografico/swagger-ui.html

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always