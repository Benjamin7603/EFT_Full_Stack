server:
  port: ${PORT:8085}

spring:
  application:
    name: ms-bff

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always