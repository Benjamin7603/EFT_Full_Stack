services:
  postgres-db:
    image: postgres:15
    container_name: eft-database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: eft_incendios
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - incendios-network
    restart: always
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - incendios-network
    restart: unless-stopped
  eureka-server:
    build: ./backend/ms-eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - incendios-network
    restart: unless-stopped

  ms-gateway:
    build: ./backend/ms-gateway
    container_name: ms-gateway
    ports:
      - "8000:8000"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173}
    depends_on:
      - eureka-server
    networks:
      - incendios-network
    restart: unless-stopped

  ms-usuarios:
    build: ./backend/ms-usuarios
    container_name: ms-usuarios
    ports:
      - "8082:8082"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - postgres-db
    networks:
      - incendios-network
    restart: unless-stopped

  ms-reportes:
    build: ./backend/ms-reportes
    container_name: ms-reportes
    ports:
      - "8081:8081"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - MS_GEOGRAFICO_URL=http://ms-geografico:8083
      - MS_NOTIFICACIONES_URL=http://ms-notificaciones:8084
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - eureka-server
      - postgres-db
      - redis
      - ms-geografico
      - ms-notificaciones
    networks:
      - incendios-network
    restart: unless-stopped

  ms-geografico:
    build: ./backend/ms-geografico
    container_name: ms-geografico
    ports:
      - "8083:8083"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - postgres-db
    networks:
      - incendios-network
    restart: unless-stopped

  ms-notificaciones:
    build: ./backend/ms-notificaciones
    container_name: ms-notificaciones
    ports:
      - "8084:8084"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - postgres-db
    networks:
      - incendios-network
    restart: unless-stopped

  ms-bff:
    build: ./backend/ms-bff
    container_name: ms-bff
    ports:
      - "8085:8085"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - MS_GEOGRAFICO_URL=http://ms-geografico:8083
      - MS_REPORTES_URL=http://ms-reportes:8081
      - MS_USUARIOS_URL=http://ms-usuarios:8082
      - MS_NOTIFICACIONES_URL=http://ms-notificaciones:8084
    depends_on:
      - eureka-server
      - ms-gateway
      - ms-reportes
      - ms-geografico
    networks:
      - incendios-network
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-geofire
    ports:
      - "5672:5672"   # Puerto de comunicación para Spring Boot
      - "15672:15672" # Puerto para la interfaz gráfica web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: always
    networks:
      - incendios-network

  frontend-web:
    build:
      context: ./frontend-web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: frontend-web
    ports:
      - "80:80"
    depends_on:
      - ms-bff
      - ms-gateway
    networks:
      - incendios-network
    restart: unless-stopped

networks:
  incendios-network:
    driver: bridge
