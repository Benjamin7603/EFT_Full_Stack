apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web
  namespace: geofire
  labels:
    app: frontend-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-web
  template:
    metadata:
      labels:
        app: frontend-web
    spec:
      containers:
        - name: frontend-web
          image: ${ECR_REPO_FRONTEND_WEB}:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: geofire
spec:
  type: LoadBalancer
  selector:
    app: frontend-web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
